<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>OBMC Enroll</title>

</head>
<body>
    <header>
        <nav class="navbar navbar-expand-sm bg-dark navbar-dark px-3">
            <div class="container-fluid">
                <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                    <img src="https://files.orangeapps.ph/disk001/School_Files/1/school-66/school_profile/1724046763-1128.png" alt="obmc logo" class="logo">
                    <span class="fs-6">Enroll</span>
                </a>
                
                <form class="d-flex ms-auto">
                    <input class="form-control me-2 form-control-sm" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-primary btn-sm" type="submit">Search</button>
                </form>
            </div>
        </nav>
    </header>

    <div class="content-wrapper">
        <div class="contact-card">
            <h2>Student Information</h2>
            <form>
                <div class="mb-3">
                    <label for="firstname" class="form-label small">First Name</label>
                    <input type="text" class="form-control" id="fullName" placeholder="John">
                </div>

                <div class="mb-3">
                    <label for="lastname" class="form-label small">Last Name</label>
                    <input type="text" class="form-control" id="fullName" placeholder="Doe">
                </div>
                
                <div class="mb-3">
                    <label for="birthday" class="form-label small">Birthday</label>
                    <input type="date" class="form-control" id="birthday">
                </div>

                <div>
                <label for="gender" class="form-label small">Gender</label>
                <select id="Gender" name="Gender">
                    <option>Female</option>
                    <option>Male</option>
                    <option>Rather not say</option>
                </select>
                </div>

                <div>
                <label for="Gradelevel" class="form-label small">Grade Level</label>
                <select id="gradelevel" name="gradelevel">
                    <option>Junior Casa</option>
                    <option>Junior Advance</option>
                    <option>Advanced Casa</option>
                    <option>Primary</option>
                    <option>Intermed</option>
                    <option>Junior Highschool</option>
                    <option>Senior Highschool</option>
                </select>
                </div>

                <div class="mb-3">
                        <label for="address" class="form-label small">Address</label>
                        <input type="text" class="form-control" id="address">
                </div>

                <div class="mb-3">
                        <label for="religion" class="form-label small">Religous Affliation</label>
                        <input type="text" class="form-control" id="religion">
                </div>

                <div class="mb-3">
                        <label for="nationality" class="form-label small">Nationality</label>
                        <input type="text" class="form-control" id="nationality">
                </div>
            
            <h2>Contact Details</h2>

                <div class="mb-3">
                        <label for="email" class="form-label small">Email</label>
                        <input type="text" class="form-control" id="email" placeholder="student@example.com">
                    </div>

                <div class="mb-3">
                        <label for="phonenumber" class="form-label small">Phone Number</label>
                        <input type="text" class="form-control" id="phonenumber" placeholder="0123-456-7890">
                    </div>
                
                <div class="mb-3">
                    <label for="phonenumber" class="form-label small">Emergency Contact</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="mother" value="mother"> Mother</label>
                        <label><input type="checkbox" name="father" value="father"> Father</label>
                        <label><input type="checkbox" name="gardian" value="gardian">Gardian</label>
                        <input type="text" class="form-control" id="emergencynumber" placeholder="0123-456-7890">
                    </div>
                </div>
            <h2>Other Information</h2>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="f2f" value="f2f"> Face-to-Face</label>
                        <label><input type="checkbox" name="online" value="online">Online</label>
                    </div>

                    <div class="mb-3">
                        <label for="howlearn" class="form-label small">How did you learn about OBMC?</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="website" value="website">Website</label>
                            <label><input type="checkbox" name="Sm" value="Sm">Social Media</label>
                            <label><input type="checkbox" name="friends" value="friends">Friends</label>
                            <label><input type="checkbox" name="other" value="other">Other</label>
                        </div>
                    </div>

    

                <button type="submit" class="btn btn-primary w-100 py-2">Send Message</button>
            </form>
        </div>
    </div>
</body>

<footer>
        <div class="container">
            <small> © 2026 Seatwork 2| Created by Chelsea Coronado 9-Jade </small>
        </div>
</footer>
</body>
</html>
